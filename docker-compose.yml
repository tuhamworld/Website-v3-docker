version: "3.9"

services:

  db:
    image: postgres:15
    container_name: postgres-db
    restart: always
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - app-network
  
  backend:
    build: ./backend
    container_name: express-backend
    restart: always
    env_file:
      - .env
    depends_on:
      - db
    ports:
      - "5000:5000"
    networks:
      - app-network
  
  frontend:
    build: ./frontend
    container_name: react-frontend
    restart: always
    environment:
      - VITE_API_URL=http://backend:5000/api
    depends_on:
      - backend
    ports:
      - "80:80"
    networks:
      - app-network

networks:
  app-network:

volumes:
  postgres_data: